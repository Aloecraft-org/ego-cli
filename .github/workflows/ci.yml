name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Must match the pinned wasm-bindgen version in Cargo.toml/Cargo.lock, and
  # the one ego-platform pins. The bindgen ABI is unstable and
  # wasm-bindgen-test-runner refuses to run on a mismatch.
  WASM_BINDGEN_VERSION: 0.2.114

jobs:
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: make fmt_check
      - name: Clippy (native, WASI, browser)
        run: make clippy

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same commands as `make build_native` / `make test_native`
      # (invoked directly because GNU make isn't on the Windows runners).
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  wasi:
    name: WASI (wasm32-wasip2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Build
        run: make build_wasi
      - name: Test (under wasmtime)
        run: make test_wasi

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two engines, SpiderMonkey and V8, for the price of one more job.
        browser: [firefox, chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli (prebuilt, pinned)
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"/wasm-bindgen* /usr/local/bin/
          wasm-bindgen-test-runner --version

      # The browser and its driver are installed here rather than taken from
      # the runner image: what `ubuntu-latest` ships changes when the image
      # version rolls, and wasm-bindgen-test-runner silently picks whichever
      # driver it finds first on PATH -- so the image would be deciding which
      # engine ran, without saying which. Naming the driver in GECKODRIVER /
      # CHROMEDRIVER makes each leg test what its name claims.
      #
      # These actions are referenced by their `latest` branch because that is
      # what they publish and document; setup-geckodriver has no release tags
      # to pin to. Pin to a commit SHA if a floating ref is not acceptable.
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest
      - name: Install geckodriver
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-geckodriver@latest
      - name: Select geckodriver
        if: matrix.browser == 'firefox'
        run: echo "GECKODRIVER=$(command -v geckodriver)" >> "$GITHUB_ENV"

      - name: Install Chrome and chromedriver
        id: chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@latest
        with:
          # Guarantees a driver whose major version matches the browser;
          # a mismatch is refused outright by chromedriver.
          install-chromedriver: true
      - name: Select chromedriver
        if: matrix.browser == 'chrome'
        run: echo "CHROMEDRIVER=${{ steps.chrome.outputs.chromedriver-path }}" >> "$GITHUB_ENV"

      - name: Build
        run: make build_browser
      # Runs via wasm-bindgen-test-runner (see .cargo/config.toml).
      - name: Test (headless ${{ matrix.browser }})
        run: make test_browser
