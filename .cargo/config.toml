[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

[target.wasm32-wasip2]
# Without a runner cargo tries to exec the .wasm directly and gets EACCES.
runner = ["wasmtime", "run", "--dir=.", "--"]
# FIXME: wasip2 is still considered unstable. Drop this once it stabilizes.
rustflags = [
    "-C", "target-feature=+bulk-memory,+mutable-globals",
    "--cfg", "wasi_ext",
]

# No [build] target on purpose: bare cargo commands build for the host, which
# is what `make *_native` expects. Wasm targets are selected with --target.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
