[package]
name = "ego_cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform line editing for command-line apps: history, word motions, undo/redo, completion and highlighting hooks, on native, WASI P2, and the browser"
license = "Apache-2.0"
repository = "https://github.com/aloecraft-org/ego-cli"

# ego_shell is kept as a transplant reference; it does not build (its path
# dependencies live outside this repo) and is not a workspace member.
[workspace]
exclude = ["ego_shell"]

[lib]
name = "ego_cli"
path = "src/lib.rs"

[[bin]]
name = "ego-cli-demo"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
# The backends that need an async runtime: `term::native::NativeTerminal`
# (crossterm's EventStream), `term::stdio::CookedStdio`, and `History`'s
# blob-store persistence. Pulls in ego_platform, tokio and
# crossterm/event-stream.
#
# Turn it off for a native build that has no runtime and does not want one.
# `term::blocking::BlockingNative` remains, `term::platform()` returns it,
# and nothing in the dependency tree needs an executor.
runtime = ["dep:ego_platform", "dep:futures-util", "dep:tokio", "crossterm/event-stream"]

[dependencies]
log = "0.4"
unicode-segmentation = "1.12"
unicode-width = "0.2"
ego_platform = { git = "https://github.com/aloecraft-org/ego-platform", branch = "main", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false, optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"], optional = true }

# The browser backend queues xterm.js input on a channel; tokio's `sync` is
# runtime-free, so this is not the `runtime` feature's tokio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Pinned to match ego_platform; the wasm-bindgen ABI must agree with the
# wasm-bindgen-cli / test-runner installed in CI.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
# Always present so the tests build with or without `runtime`.
ego_platform = { git = "https://github.com/aloecraft-org/ego-platform", branch = "main" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Proves the point of `BlockingNative`: a `Session` over it completes under a
# plain executor with no runtime anywhere.
futures-executor = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
