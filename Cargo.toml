[package]
name = "ego_cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform line editing for command-line apps: history, word motions, undo/redo, completion and highlighting hooks, on native, WASI P2, and the browser"
license = "Apache-2.0"
repository = "https://github.com/aloecraft-org/ego-cli"

# ego_shell is kept as a transplant reference; it does not build (its path
# dependencies live outside this repo) and is not a workspace member.
[workspace]
exclude = ["ego_shell"]

[lib]
name = "ego_cli"
path = "src/lib.rs"

[[bin]]
name = "ego-cli-demo"
path = "src/main.rs"

[dependencies]
ego_platform = { git = "https://github.com/aloecraft-org/ego-platform", branch = "main" }
log = "0.4"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Pinned to match ego_platform; the wasm-bindgen ABI must agree with the
# wasm-bindgen-cli / test-runner installed in CI.
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
