<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EgoShell</title>
    <link data-trunk rel="rust" href="../Cargo.toml" data-wasm-opt="z" data-bin="cli_lite"/>
    <!-- <link data-trunk rel="rust" data-wasm-opt="z" data-bin="cli_lite"/> -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@latest/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@latest/lib/xterm.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        .console-note {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #4a90e2;
            margin-top: 20px;
        }

        code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>

<body>
    <h1>🌿 EgoShell</h1>
    <div class="console-note">
        <h2>Console Output</h2>
        <p>Open your browser's developer console to see the output:</p>
        <ul>
            <li><strong>Chrome/Edge:</strong> Press <code>F12</code> or <code>Ctrl+Shift+I</code></li>
            <li><strong>Firefox:</strong> Press <code>F12</code> or <code>Ctrl+Shift+K</code></li>
            <li><strong>Safari:</strong> Press <code>Cmd+Option+C</code></li>
        </ul>
        <p>You should see "Hello" messages appearing every 2 seconds in the console.</p>

        <div id="terminal"></div>
        <script>
            var term = new window.Terminal({
                cursorBlink: true
            });
            term.open(document.getElementById('terminal'));
        </script>

        <!-- Add after terminal initialization script -->
        <script type="module">
            import init, { initShell, sendInput } from './cli_lite.js';
            await init(); 
            const shell = initShell();

            window.term.onData(data =>
            {
                if (data === '\r')
                {
                    const input = window.currentInput || '';
                    window.term.writeln('');
                    window.term.write('> ');
                    sendInput(input);
                    window.currentInput = '';
                } else if (data === '\x7f')
                {
                    if (window.currentInput && window.currentInput.length > 0)
                    {
                        window.currentInput = window.currentInput.slice(0, -1);
                        window.term.write('\b \b');
                    }
                } else
                {
                    window.currentInput = (window.currentInput || '') + data;
                    window.term.write(data);
                }
            });

            window.currentInput = '';
            window.term.writeln('EgoShell v0.1.0');
            window.term.write('> ');
        </script>
    </div>
</body>
</html>
